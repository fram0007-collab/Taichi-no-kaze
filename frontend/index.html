<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DIS-RUPTURE | Predictive Early Warning Dashboard</title>
    <script>
      try {
        if ((localStorage.getItem('theme') || 'light') === 'light') {
          document.documentElement.classList.add('boot-light');
        }
      } catch (e) { /* ignore */ }
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; align-items: center; justify-content: center;
        padding: 16px; box-sizing: border-box;
        background: #020617;
        font-family: system-ui, sans-serif;
      }
      html.boot-light #boot-splash { background: #f8fafc; }
      #boot-splash .card {
        width: 100%; max-width: 24rem;
        border-radius: 16px; padding: 24px;
        border: 1px solid #1e293b; background: #0f172a;
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
        text-align: center;
      }
      html.boot-light #boot-splash .card {
        border-color: #e2e8f0; background: #fff;
      }
      #boot-splash .mark {
        width: 52px; height: 52px; margin: 0 auto 12px;
        border-radius: 12px; display: flex; align-items: center; justify-content: center;
        border: 1px solid #3730a3; background: rgb(99 102 241 / 0.12); color: #818cf8;
      }
      html.boot-light #boot-splash .mark {
        border-color: #c7d2fe; background: #eef2ff; color: #4f46e5;
      }
      #boot-splash h1 {
        margin: 0; font-size: 1.125rem; letter-spacing: 0.06em;
        text-transform: uppercase; color: #f1f5f9;
      }
      html.boot-light #boot-splash h1 { color: #0f172a; }
      #boot-splash p {
        margin: 6px 0 0; font-size: 11px; letter-spacing: 0.16em;
        text-transform: uppercase; color: #94a3b8;
      }
      html.boot-light #boot-splash p { color: #64748b; }
      #boot-splash .bar {
        height: 4px; margin-top: 20px; border-radius: 999px; overflow: hidden;
        background: #1e293b;
      }
      html.boot-light #boot-splash .bar { background: #e2e8f0; }
      #boot-splash .bar > span {
        display: block; height: 100%; width: 35%;
        background: #6366f1;
        animation: boot-bar 1.1s ease-in-out infinite;
      }
      @keyframes boot-bar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </noscript>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DIS-RUPTURE" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  </head>
  <body class="bg-brand-dark text-slate-100 antialiased overflow-x-hidden">
    <div id="root">
      <div id="boot-splash">
        <div class="card">
          <div class="mark">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
          </div>
          <h1>DIS-RUPTURE</h1>
          <p>Jabodetabek disruption alerts</p>
          <div class="bar"><span></span></div>
        </div>
      </div>
    </div>
    <!-- Runtime API URL config — written by docker-entrypoint.sh at container startup.
         Sets window.__API_URL__ so the LAN IP can be injected without rebuilding the image.
         In local dev this file won't exist; the app falls back to import.meta.env.VITE_API_URL. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
